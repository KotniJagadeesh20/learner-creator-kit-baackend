services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learn_creator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/learn_creator
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Set SPRING_PROFILES_ACTIVE=seed in your .env to insert mock data on startup — see README.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-me-before-any-real-deploy}
      JWT_ACCESS_EXPIRY_MIN: ${JWT_ACCESS_EXPIRY_MIN:-15}
      JWT_REFRESH_EXPIRY_DAYS: ${JWT_REFRESH_EXPIRY_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_CUSTOMER_SUBDOMAIN: ${CLOUDFLARE_CUSTOMER_SUBDOMAIN:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      # Assumes the frontend repo is checked out as a sibling directory named
      # "learn-creator-kit-main" next to this backend repo. Adjust this path to match
      # your actual local layout — this is the one thing you'll need to edit yourself.
      context: ../learn-creator-kit-main
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_CLOUDFLARE_CUSTOMER_SUBDOMAIN: ${CLOUDFLARE_CUSTOMER_SUBDOMAIN:-customer-placeholder}
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
