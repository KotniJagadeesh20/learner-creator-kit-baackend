spring:
  application:
    name: learn-creator-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learn_creator}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # use 'validate' once you introduce Flyway/Liquibase migrations.
      # 'update' is fine while iterating locally in early development.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # 256-bit+ secret. NEVER commit a real secret — inject via env var / AWS Secrets Manager in production.
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-value-in-env-vars-only}
    access-token-expiry-minutes: ${JWT_ACCESS_EXPIRY_MIN:15}
    refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}
  cors:
    # Comma-separated list — the Vite dev server default port is 5173.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
  cloudflare:
    account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    api-token: ${CLOUDFLARE_API_TOKEN:}
    customer-subdomain: ${CLOUDFLARE_CUSTOMER_SUBDOMAIN:}
